# KeePassXC settings for the local browser protocol, used by
# keepassxc-native-session.sh. Enabled is what makes the socket exist at all.
#
# AlwaysAllowAccess stands in for a person having ticked "Remember my choice"
# in the access dialog: without it KeePassXC asks for confirmation on every
# read, and that dialog blocks the reply until it is answered.
[Browser]
Enabled=true
AlwaysAllowAccess=true
AlwaysAllowUpdate=true
