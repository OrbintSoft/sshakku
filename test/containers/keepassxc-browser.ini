# KeePassXC settings for the local browser protocol, used by the test sessions
# that drive a real KeePassXC. Enabled is what makes the socket exist at all.
#
# AlwaysAllowAccess stands in for a person having ticked "Remember my choice"
# in the access dialog: without it KeePassXC asks for confirmation on every
# read, and that dialog blocks the reply until it is answered.
[Browser]
Enabled=true
AlwaysAllowAccess=true
AlwaysAllowUpdate=true

# KeePassXC offers to check for updates the first time it runs and records that
# it has asked. Answering it already means nothing is waiting on a question
# nobody is there to answer.
[General]
UpdateCheckMessageShown=true
