name: Desktop secret stacks

# Integration tests run on demand, not on every PR: a manual dispatch, or a
# push whose head commit opts in with [integration] in its message (see the
# job `if:` below), so one marked push exercises the whole integration suite.
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only builds and runs the checked-out tree's test suite inside a container;
# no write scopes.
permissions:
  contents: read

jobs:
  container-test:
    name: make test (desktop-stack / ${{ matrix.name }})
    # workflow_dispatch always runs; a push runs only when its head commit
    # opts in, so integration runs stay deliberate.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kde
            dockerfile: test/containers/kde.Dockerfile
          - name: gnome-keyring
            dockerfile: test/containers/gnome-keyring.Dockerfile
          - name: keepassxc
            dockerfile: test/containers/keepassxc.Dockerfile
          - name: vaultwarden
            dockerfile: test/containers/vaultwarden.Dockerfile
          - name: wayland
            dockerfile: test/containers/wayland.Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }} test image
        run: docker build -f ${{ matrix.dockerfile }} -t sshakku-test-desktop-stack-${{ matrix.name }} .

      - name: Run make test in ${{ matrix.name }}
        run: docker run --init --rm -v "${{ github.workspace }}":/src:ro sshakku-test-desktop-stack-${{ matrix.name }} make test

      # The same wallet reached from a login with a screen and no X server. The
      # image and the test are the ones the step above already ran: what is
      # being varied is the session around them, so a difference in the result
      # could only come from the session.
      - name: Run the KDE round trip in a Wayland session
        if: matrix.name == 'kde'
        run: >
          docker run --init --rm -v "${{ github.workspace }}":/src:ro
          -e SSHAKKU_SESSION_SCRIPT=kde-wayland-session.sh
          sshakku-test-desktop-stack-kde
          go test ./internal/keys -run TestSecretServiceBackendRealDaemon -count=1 -v

      # Where a user is asked for a passphrase on a Wayland desktop, driven
      # through the real binary in a session with a screen and no controlling
      # terminal. The image's own dialogs are what make it worth running: its
      # pinentry announces a toolkit and then cannot draw, which is the case a
      # list of installed programs cannot see coming.
      - name: Run the Wayland passphrase-prompt scenario
        if: matrix.name == 'wayland'
        run: >
          docker run --init --rm -v "${{ github.workspace }}":/src:ro
          sshakku-test-desktop-stack-wayland
          test/containers/wayland-prompt-scenario.sh

      # The CLI route works on a database file with no KeePassXC running, so it
      # needs none of the image's X/D-Bus session — only keepassxc-cli, which
      # the same image already carries. The entrypoint is bypassed for that
      # reason.
      - name: Run the real keepassxc-cli round trip
        if: matrix.name == 'keepassxc'
        run: |
          docker run --init --rm -v "${{ github.workspace }}":/src:ro \
            -e SSHAKKU_TEST_ALLOW_REAL_KEEPASSXC=1 -e HOME=/tmp/h -e GOCACHE=/tmp/gc \
            --entrypoint bash sshakku-test-desktop-stack-keepassxc \
            -c 'mkdir -p /tmp/h && cd /src && go test ./internal/keys -run TestKeePassXCCLIRealDatabase -count=1 -v'

      # The user's whole scenario over KeePassXC's local protocol, against a
      # real GUI and an ssh-agent of the test's own. It carries a passphrase
      # through the kernel keyring, which needs seccomp left alone (the default
      # profile refuses keyctl outright) and a session keyring to possess the
      # keys it adds — see keyring-session.sh.
      - name: Run the real KeePassXC native round trip
        if: matrix.name == 'keepassxc'
        run: >
          docker run --init --rm --security-opt seccomp=unconfined
          -v "${{ github.workspace }}":/src:ro
          -e SSHAKKU_SESSION_SCRIPT=keepassxc-native-session.sh
          sshakku-test-desktop-stack-keepassxc
          keyctl session - /opt/sshakku-desktop-stack/keyring-session.sh
          go test ./internal/keys -run TestKeePassXCNativeFullRound -count=1 -v

  keepassxc-macos:
    name: KeePassXC on macOS
    # Same integration gate as container-test: manual dispatch, or a push whose
    # head commit opts in with [integration].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      # The cask ships the command-line tool inside the app bundle; the cli
      # route looks it up by name, so the bundle's directory goes on PATH.
      - name: Install KeePassXC
        run: |
          brew install --cask keepassxc
          echo "/Applications/KeePassXC.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: Run the real keepassxc-cli round trip
        env:
          SSHAKKU_TEST_ALLOW_REAL_KEEPASSXC: "1"
        run: go test ./internal/keys -run TestKeePassXCCLIRealDatabase -count=1 -v

      # The same user scenario the container runs, against the same app: no
      # KeePassXC is running here, so the test is told where to find one and
      # starts it itself.
      - name: Run the real KeePassXC native round trip
        env:
          SSHAKKU_TEST_ALLOW_REAL_KEEPASSXC_NATIVE: "1"
          SSHAKKU_TEST_KEEPASSXC_APP: /Applications/KeePassXC.app/Contents/MacOS/KeePassXC
        run: go test ./internal/keys -run TestKeePassXCNativeFullRound -count=1 -v

  midsession-failure:
    name: mid-session failure (${{ matrix.scenario }})
    # Same integration gate as container-test: manual dispatch, or a push whose
    # head commit opts in with [integration].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A killed daemon must not be respawned by the bus for the test to
          # observe it staying down, so this scenario removes the activation file.
          - scenario: daemon-stopped
            run: TestSecretServiceMidSessionFailure/daemon
            disable_activation: "1"
          - scenario: bus-unreachable
            run: TestSecretServiceMidSessionFailure/session_bus
            disable_activation: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuses the gnome-keyring image: its single daemon is the simplest one to
      # kill and watch recover from, and a fresh container per scenario keeps the
      # kill from touching any other test.
      - name: Build gnome-keyring test image
        run: docker build -f test/containers/gnome-keyring.Dockerfile -t sshakku-test-desktop-stack-gnome-keyring .

      - name: Run mid-session ${{ matrix.scenario }} scenario
        run: >
          docker run --init --rm -v "${{ github.workspace }}":/src:ro
          -e SSHAKKU_DISABLE_SECRETS_ACTIVATION=${{ matrix.disable_activation }}
          sshakku-test-desktop-stack-gnome-keyring
          go test -tags midsession_failure -count=1 -run '${{ matrix.run }}' ./internal/keys/

  unresponsive-backend:
    name: unresponsive backend (frozen daemon)
    # Same integration gate as container-test: manual dispatch, or a push whose
    # head commit opts in with [integration].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuses the gnome-keyring image: SIGSTOP-freezing its single daemon
      # leaves it owning org.freedesktop.secrets, so the bus never respawns a
      # replacement and no activation-file removal is needed, unlike the
      # daemon-stopped mid-session scenario.
      - name: Build gnome-keyring test image
        run: docker build -f test/containers/gnome-keyring.Dockerfile -t sshakku-test-desktop-stack-gnome-keyring .

      - name: Run frozen-daemon scenario
        run: >
          docker run --init --rm -v "${{ github.workspace }}":/src:ro
          sshakku-test-desktop-stack-gnome-keyring
          go test -tags backend_unresponsive -count=1 -run TestSecretServiceUnresponsiveDaemon ./internal/keys/
