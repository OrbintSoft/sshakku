name: Desktop secret stacks

# Integration tests run on demand, not on every PR: a manual dispatch, or a
# push whose head commit opts in with [integration] in its message (see the
# job `if:` below), so one marked push exercises the whole integration suite.
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only builds and runs the checked-out tree's test suite inside a container;
# no write scopes.
permissions:
  contents: read

jobs:
  container-test:
    name: make test (desktop-stack / ${{ matrix.name }})
    # workflow_dispatch always runs; a push runs only when its head commit
    # opts in, so integration runs stay deliberate.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kde
            dockerfile: test/containers/kde.Dockerfile
          - name: gnome-keyring
            dockerfile: test/containers/gnome-keyring.Dockerfile
          - name: keepassxc
            dockerfile: test/containers/keepassxc.Dockerfile
          - name: vaultwarden
            dockerfile: test/containers/vaultwarden.Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }} test image
        run: docker build -f ${{ matrix.dockerfile }} -t sshakku-test-desktop-stack-${{ matrix.name }} .

      - name: Run make test in ${{ matrix.name }}
        run: docker run --init --rm -v "${{ github.workspace }}":/src:ro sshakku-test-desktop-stack-${{ matrix.name }} make test

  midsession-failure:
    name: mid-session failure (${{ matrix.scenario }})
    # Same integration gate as container-test: manual dispatch, or a push whose
    # head commit opts in with [integration].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A killed daemon must not be respawned by the bus for the test to
          # observe it staying down, so this scenario removes the activation file.
          - scenario: daemon-stopped
            run: TestSecretServiceMidSessionFailure/daemon
            disable_activation: "1"
          - scenario: bus-unreachable
            run: TestSecretServiceMidSessionFailure/session_bus
            disable_activation: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuses the gnome-keyring image: its single daemon is the simplest one to
      # kill and watch recover from, and a fresh container per scenario keeps the
      # kill from touching any other test.
      - name: Build gnome-keyring test image
        run: docker build -f test/containers/gnome-keyring.Dockerfile -t sshakku-test-desktop-stack-gnome-keyring .

      - name: Run mid-session ${{ matrix.scenario }} scenario
        run: >
          docker run --init --rm -v "${{ github.workspace }}":/src:ro
          -e SSHAKKU_DISABLE_SECRETS_ACTIVATION=${{ matrix.disable_activation }}
          sshakku-test-desktop-stack-gnome-keyring
          go test -tags midsession_failure -count=1 -run '${{ matrix.run }}' ./internal/keys/

  unresponsive-backend:
    name: unresponsive backend (frozen daemon)
    # Same integration gate as container-test: manual dispatch, or a push whose
    # head commit opts in with [integration].
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuses the gnome-keyring image: SIGSTOP-freezing its single daemon
      # leaves it owning org.freedesktop.secrets, so the bus never respawns a
      # replacement and no activation-file removal is needed, unlike the
      # daemon-stopped mid-session scenario.
      - name: Build gnome-keyring test image
        run: docker build -f test/containers/gnome-keyring.Dockerfile -t sshakku-test-desktop-stack-gnome-keyring .

      - name: Run frozen-daemon scenario
        run: >
          docker run --init --rm -v "${{ github.workspace }}":/src:ro
          sshakku-test-desktop-stack-gnome-keyring
          go test -tags backend_unresponsive -count=1 -run TestSecretServiceUnresponsiveDaemon ./internal/keys/
