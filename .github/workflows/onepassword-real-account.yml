name: 1Password service account

# Integration tests run on demand, not on every PR: a manual dispatch, or a
# push whose head commit opts in with [integration] in its message (see the
# job `if:` below), so one marked push exercises the whole integration suite.
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only builds and runs the checked-out tree's test suite; no write scopes.
permissions:
  contents: read

jobs:
  real-account-test:
    name: OnePasswordBackend real-account test
    # workflow_dispatch always runs; a push runs only when its head commit
    # opts in, so integration runs stay deliberate.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Install the 1Password CLI
        uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Run TestOnePasswordBackendRealAccount
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_TOKEN }}
          SSHAKKU_TEST_ALLOW_REAL_ONEPASSWORD: "1"
        run: go test -count=1 -run OnePasswordBackendRealAccount -v ./internal/keys/...
