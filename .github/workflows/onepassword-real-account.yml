name: 1Password service account

# Integration tests run on demand, not on every PR: a manual dispatch, or a
# push whose head commit opts in with [integration] in its message (see the
# job `if:` below), so one marked push exercises the whole integration suite.
on:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only builds and runs the checked-out tree's test suite; no write scopes.
permissions:
  contents: read

jobs:
  real-account-test:
    name: OnePasswordBackend real-account test (${{ matrix.os }})
    # workflow_dispatch always runs; a push runs only when its head commit
    # opts in, so integration runs stay deliberate.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[integration]')
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's answer is not the other's: cancelling the rest because
      # one failed would throw away the very comparison this job is for.
      #
      # Linux and macOS offer this wallet, so they are asked about a wallet
      # their users can choose. Windows is asked before it offers one — a
      # 1Password account is a cloud account rather than a local daemon a
      # container can stand up, so this job is the only place the round trip
      # can happen there, and it has to happen before the wallet is put in
      # front of anybody.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Install the 1Password CLI
        uses: 1Password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0

      - name: Run TestOnePasswordBackendRealAccount
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_TOKEN }}
          SSHAKKU_TEST_ALLOW_REAL_ONEPASSWORD: "1"
        # Named rather than left to the runner: two of these three default to
        # bash and the third to PowerShell, which would not run this script at
        # all. What the script needs beyond Go — mktemp, tee, grep — the bash
        # on every one of them has.
        shell: bash
        run: ./test/onepassword-real-account.sh
