name: Tests

# pull_request lets pr-test-report post/update the test-health PR comment,
# and covers every feature-branch push (a push to an open PR's branch fires
# pull_request, not push). push is scoped to master only, so post-merge
# commits there still get tested without every PR push running twice.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; pr-test-report and publish-coverage-report grant
# themselves write access at the job level, the only jobs that need to write
# anything.
permissions:
  contents: read

# go install is pinned by full commit hash (mirrors the SHA-pinning used for
# the third-party actions below); *_VERSION is kept for human-readable
# go install version comments.
env:
  GOTESTSUM_VERSION: 1.13.0
  GOTESTSUM_COMMIT: c4a0df2e75a225d979a444342dd3db752b53619f
  GOPOGH_VERSION: 0.29.0
  GOPOGH_COMMIT: 8b1e14a7bf74e0bf3d22ad3dd4f4dac06b628595
  GO_BETTER_HTML_COVERAGE_VERSION: 1.2.0
  GO_BETTER_HTML_COVERAGE_COMMIT: 02341504e2b24350ec3029fb02144134f292f831
  GO_IGNORE_COV_VERSION: 0.7.1
  GO_IGNORE_COV_COMMIT: 23957747f586d1575f56023ee4eff1a6498df17a
  # Every suite this workflow runs is asked for under the race detector: a data
  # race that only shows up once in a hundred runs is worth catching on every
  # one of them, and nothing here is time-critical enough to mind the cost.
  SSHAKKU_RACE: "1"

jobs:
  test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Ensure dbus-daemon is available
        run: command -v dbus-daemon || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dbus)

      - name: Install test tools (gotestsum, gopogh)
        run: .github/scripts/install-test-tools.sh

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Before the suite, because it is quick and it fails for a reason no test
      # failure could be confused with: this machine has neither a Mac nor an
      # Apple SDK, so it is the one that can tell whether the macOS half of the
      # tree still builds without them — and the same run is what keeps the
      # platforms this job never executes from silently stopping compiling.
      - name: Build every platform without a C toolchain
        run: make build-cross

      - name: Run make test-json
        run: make test-json

      - name: Run goroutine leak profile checks
        run: make test-leakprofile

      - name: Build test-health report
        if: always()
        run: go run ./tools/testreport -os linux -coverprofile=coverage.out < test.json > report-linux.json

      - name: Upload test-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-linux
          path: report-linux.json

      - name: Build HTML test report
        if: always()
        run: gopogh -in test.json -out_html report-linux.html -name Linux -repo github.com/OrbintSoft/sshakku -details "${{ github.sha }}"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-html-linux
          path: report-linux.html

      - name: Build coverage HTML report
        if: always()
        run: go-better-html-coverage -profile coverage.out -o coverage-linux.html -n

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage-linux.html

  test-macos:
    name: make test (macos)
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Install test tools (gotestsum, gopogh)
        run: .github/scripts/install-test-tools.sh

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run make test-json
        run: make test-json

      # The only AppleScript checker there is ships with macOS, so this is the
      # one job that can actually run it; make lint skips it everywhere else.
      - name: Run make lint-applescript
        run: make lint-applescript

      - name: Point the default keychain at a throwaway one
        run: test/macos-keychain-setup.sh

      - name: Run live keychain integration test
        run: make test-keychain

      # Ahead of the shell suite: it shares nothing with it, and running it
      # afterwards means a failing suite skips it entirely.
      - name: Smoke-test make install/install-user (staged, not the real /etc or $HOME)
        run: test/macos-install-smoke.sh "$RUNNER_TEMP/install-smoke"

      - name: Install bats-core
        run: brew install bats-core

      # A GitHub-hosted runner is thrown away after the job, which is what the
      # suite's opt-in gate asks for. It runs after the keychain setup above so
      # anything it stores lands in the throwaway keychain. Bounded because a
      # shell suite that hangs is precisely one of the failures it exists to
      # catch, and a hang here would otherwise run to the job's own limit.
      - name: Run make test-bats
        env:
          SSHAKKU_TEST_ALLOW_BATS: "1"
          SSHAKKU_BATS_TRACE: ${{ runner.temp }}/bats-trace.log
        timeout-minutes: 6
        run: make test-bats

      # bats reports a test only once it has ended, so a run killed for
      # exceeding the limit above leaves no record of which test it was in or
      # how far that test got. The trace is written as the suite goes and is
      # the only thing that survives being killed.
      - name: Show the bats progress trace
        if: always()
        run: cat "$RUNNER_TEMP/bats-trace.log" || true

      - name: Build test-health report
        if: always()
        run: go run ./tools/testreport -os macos -coverprofile=coverage.out < test.json > report-macos.json

      - name: Upload test-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-macos
          path: report-macos.json

      - name: Build HTML test report
        if: always()
        run: gopogh -in test.json -out_html report-macos.html -name macOS -repo github.com/OrbintSoft/sshakku -details "${{ github.sha }}"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-html-macos
          path: report-macos.html

      - name: Build coverage HTML report
        if: always()
        run: go-better-html-coverage -profile coverage.out -o coverage-macos.html -n

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-macos
          path: coverage-macos.html

  container-test:
    name: make test (container / ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            dockerfile: test/containers/debian.Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.name }} test image
        run: docker build -f ${{ matrix.dockerfile }} -t sshakku-test-${{ matrix.name }} .

      - name: Run make test in ${{ matrix.name }}
        run: docker run --init --rm -e SSHAKKU_RACE=1 -v "${{ github.workspace }}":/src:ro -w /src sshakku-test-${{ matrix.name }} make test

      - name: Run make test-bats in ${{ matrix.name }}
        run: docker run --init --rm -e SSHAKKU_TEST_ALLOW_BATS=1 -v "${{ github.workspace }}":/src:ro -w /src sshakku-test-${{ matrix.name }} make test-bats

  test-windows:
    name: go test (windows)
    runs-on: windows-latest
    # Two questions, asked on the machine that can answer them: does the tree
    # still compile and type-check its own tests here, and does the suite pass?
    # `make build-cross` asks the first from Linux — whether Windows can be
    # built from elsewhere — and neither substitutes for the other, since a
    # toolchain that cross-compiles cleanly can still meet a native runner's own
    # defaults.
    #
    # The commands spelled out rather than `make test-json`: this runner has no
    # GNU Make. They are the ones that target runs — the same gotestsum
    # invocation and the same go-ignore-cov pass after it — and the two have to
    # be kept in step by hand.
    #
    # What the suite does not cover here is worth knowing. A promise that needs
    # a wallet is not asked on this platform, because there is none it can
    # reach yet: those tests are held to the systems that have one, and the
    # files say so where they sit. Nothing here is an integration test either —
    # no agent is started, no wallet is opened — so docs/TEST-MATRIX.md gains no
    # row from this job, which tracks integration coverage and counts a unit
    # test with a faked dependency as not covered. The coverage this job
    # measures and publishes is unit coverage, and that is a different question
    # from the one that document asks.
    defaults:
      run:
        # Git Bash, which the runner image ships. Two reasons that are not
        # taste: PowerShell splits `-coverprofile=coverage.out` into
        # `-coverprofile=coverage` and `.out`, so `go test` writes the profile
        # to a file named `coverage` and then fails on a package that does not
        # exist; and the report step feeds test.json in on standard input,
        # which PowerShell has no operator for.
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Install test tools (gotestsum, gopogh)
        run: .github/scripts/install-test-tools.sh

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Built the way the shipped binary is: no cgo, no C toolchain needed.
      - name: Build every package
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # vet type-checks the test files too, which is what catches a _windows.go
      # that never supplied something the shared tests reach for — a gap no
      # `go build` would show, since it never compiles them.
      - name: Vet every package, test files included
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      # The race detector is built on cgo, so this step is the one that needs a
      # C compiler; the runner image ships one. Bounded because a suite that
      # hangs is one of the failures this job exists to catch, and a hang would
      # otherwise run to the job's own limit.
      - name: Run the test suite
        env:
          CGO_ENABLED: "1"
        timeout-minutes: 15
        run: |
          gotestsum --jsonfile test.json -- -race -coverprofile=coverage.out ./...
          go-ignore-cov --file coverage.out --root .

      - name: Build test-health report
        if: always()
        run: go run ./tools/testreport -os windows -coverprofile=coverage.out < test.json > report-windows.json

      - name: Upload test-health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-windows
          path: report-windows.json

      - name: Build HTML test report
        if: always()
        run: gopogh -in test.json -out_html report-windows.html -name Windows -repo github.com/OrbintSoft/sshakku -details "${{ github.sha }}"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-html-windows
          path: report-windows.html

      - name: Build coverage HTML report
        if: always()
        run: go-better-html-coverage -profile coverage.out -o coverage-windows.html -n

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-windows
          path: coverage-windows.html

  pr-test-report:
    name: Post test-health PR comment
    needs: [test, test-macos, test-windows]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Download report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          merge-multiple: true

      - name: Render test-health comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/render-pr-comment.sh report-linux.json report-macos.json report-windows.json > comment.md

      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/post-test-report-comment.sh "${{ github.event.pull_request.number }}" < comment.md

  publish-coverage-report:
    name: Publish coverage badges + report
    needs: [test, test-macos, test-windows]
    if: github.ref == 'refs/heads/master' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go-env

      - name: Download report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*
          merge-multiple: true

      - name: Download coverage HTML report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Build coverage badge JSON (linux)
        run: go run ./tools/testreport badge report-linux.json > coverage-linux.json

      - name: Build coverage badge JSON (macos)
        run: go run ./tools/testreport badge report-macos.json > coverage-macos.json

      - name: Build coverage badge JSON (windows)
        run: go run ./tools/testreport badge report-windows.json > coverage-windows.json

      - name: Build coverage report
        run: go run ./tools/testreport render report-linux.json report-macos.json report-windows.json > report.md

      - name: Publish to coverage-reports
        run: .github/scripts/publish-coverage-report.sh
