version: "2"

# Standard set: errcheck, govet, ineffassign, staticcheck, unused.
linters:
  default: standard
  # Kept in alphabetical order, so a linter can be found without reading the
  # reason it was added.
  enable:
    # A []any handed to a variadic ...any arrives as one argument, not as its
    # elements: the call compiles, and the message prints the slice where the
    # values were meant. Errors wrapped for the user are built this way.
    - asasalint

    # An identifier that is not ASCII reads as one name and resolves as
    # another — a Cyrillic о is a different letter from the o beside it. Same
    # class as bidichk, on names rather than on direction.
    - asciicheck

    # Bidirectional and zero-width Unicode can make a line read one way and
    # compile another. A tool that handles passphrases and accepts patches from
    # strangers should not rely on a reviewer noticing.
    - bidichk

    # An HTTP response body that is never closed holds its connection open, and
    # the leak stays invisible until the pool it exhausts is the one something
    # is waiting on. Nothing here speaks HTTP yet, which is the moment to put
    # the check in rather than after the first call that does.
    - bodyclose

    # A context kept in a struct field is scoped to the object rather than to
    # the call, and nothing then says which call it belonged to. It travels as
    # the first argument or it does not travel.
    - containedctx

    # A context that arrives and is not passed on: the function takes one,
    # then starts its own work from a fresh root, and the deadline the caller
    # set stops applying exactly there. This program waits on other people's
    # software — a session-bus daemon, ssh-add, a wallet's CLI, a socket
    # nobody is listening on — and the whole point of carrying a context down
    # to those waits is that one of them can be ended from above.
    - contextcheck

    # Since the loop variable became per-iteration, `x := x` inside the body
    # copies a value that was already the body's own. It is a no-op that still
    # reads like the fix for a bug, so the next loop written next to it may
    # leave the copy out and look wrong.
    - copyloopvar

    # A function that has to be read from the top to be trusted, because what it
    # does depends on which of a dozen paths was taken to get there. The bar is
    # loose because the measure charges +1 per `case`, and a flat lookup table —
    # the command dispatcher, a comm name to a human label — scores like nested
    # branching while being the easiest code here to read; splitting one to
    # satisfy a number would make finding a command harder, not easier.
    - cyclop

    # A function copied and then edited keeps the original's bugs and gains none
    # of its fixes, because the copy is the one nobody remembers to change. In a
    # test the copy claims something as well: two tests with the same body under
    # different names say two situations are covered where only one is.
    - dupl

    # Multiplying two durations gives a number in units nobody meant —
    # `timeout * time.Second` is seconds squared. Key lifetimes, agent timeouts
    # and prompt budgets are most of this program's arithmetic.
    - durationcheck

    # An embedded type brings somebody else's whole method set in with it; a
    # plain field brings a value. Written flush against each other the two read
    # the same, and the wrappers here are built on the difference — a backend
    # that forwards every call it does not intercept, a net.Conn that fails one
    # operation, a reply that carries a shared status. The blank line is what
    # says which of the two a name is.
    - embeddedstructfieldcheck

    # An error built at the point it is returned exists only as a sentence, so
    # the only way to ask what went wrong is to read the sentence — and a caller
    # matching on English is one a reworded message breaks silently. The refusals
    # here are the ones a login has to act on: a wallet this system does not have
    # is not a misspelled one, a service that is absent is not a service that is
    # disabled, and doctor --fix has to tell them apart.
    - err113

    # json.Marshal fails only for what cannot be encoded — a chan, a func, a
    # map with keys that are neither — so the check on a plain struct is dead
    # code, while the type that can actually fail is the one that tends to be
    # marshalled unchecked. This program speaks JSON to other tools' sockets.
    - errchkjson

    # Callers here match on sentinels — ErrNoTerminal, ErrPromptCanceled — so
    # what a sentinel is called is part of the package's interface.
    - errname

    # `%v` on an error flattens it into text, so the cause stops being something
    # errors.Is can find. This package family is built on sentinels callers
    # match against, and a caller cannot match what was turned into a string.
    - errorlint

    # A switch over an enum that names some of its members and not the rest,
    # with no `default:` to catch what it left out: the missing member reaches
    # the switch, matches nothing, and the code after it runs as though the
    # answer had been handled. The enums here are outcomes a login acts on —
    # what came of trying to load a key, what a service manager said — so the
    # arm nobody wrote is a decision nobody made.
    - exhaustive

    # golang.org/x/exp is where maps.Keys, slices.Sorted, constraints and
    # errors.Join lived before the standard library grew them, and it carries no
    # compatibility promise. An import that still points there takes on a
    # dependency that may change under it, for something the compiler now ships.
    - exptostd

    # A context re-wrapped inside a loop grows one layer per iteration, so what
    # started as a deadline becomes a chain of them nobody can read back.
    - fatcontext

    # An unchecked type assertion is a panic waiting for the input nobody
    # thought of, and this program parses what other tools print.
    - forcetypeassert

    # A build tag is the one comment in this tree the compiler acts on, and the
    # one that fails open: `// go:build darwin` with a space is not a directive
    # at all, so the file it guards is compiled into every platform instead of
    # one, and nothing says so.
    - gocheckcompilerdirectives

    # `init()` runs before main does, in an order across files nobody writes
    # down, and it is the one function that can be given nothing and return
    # nothing: what it decides it decides for the whole program, and what goes
    # wrong inside it can only be panicked or left in a package variable for
    # somebody to find. This program is a login shell's first act and its
    # slowest moment is another process it is waiting on, so a package that
    # arranged itself before main was reached would be work nobody asked for at
    # the moment there is least room for it — and it could not be handed the
    # context that says how long to wait, because there is none yet.
    - gochecknoinits

    # `exhaustive`'s question asked of a closed set of types rather than a set
    # of constants: an interface marked `//sumtype:decl` has a known list of
    # implementations, and a type switch that leaves one out is a case the
    # value can still arrive as. Nothing in this tree is written that way yet —
    # there is no `//sumtype:decl` and no type switch over an interface outside
    # the tests — so this reports nothing today and is here for the first one.
    # It keeps the strictness `exhaustive` above gives up, and the difference is
    # in what the two are looking at: an int enum can hold a number nobody
    # declared, so a `default:` there is reachable and is an answer; a sealed
    # interface has only the types that implement it, so a `default:` is a
    # branch that cannot be taken and hides the implementation added next.
    - gochecksumtype

    # cyclop counts the paths through a function and charges +1 per `case`, so
    # a flat lookup table scores like nested branching and its bar has to sit
    # high enough to let the tables through. Cognitive complexity charges a
    # whole `switch` +1 and charges nesting instead, so it can be given the
    # same number and have it mean something: at 20 a table of any length is
    # free, and a function that is 20 because of what is inside what is not.
    - gocognit

    # The same literal written out at each use is a rename waiting to be done
    # in three places out of four: a backend's name, an env var, a subcommand
    # the dispatcher and the command itself must agree on.
    - goconst

    # A catalogue of small ways Go code says a thing the long way round or the
    # wrong way round — a lambda that only forwards its arguments, a chain of
    # else-ifs over one value. Only the default checks are on: the tags left off
    # were measured, and they are churn or worse here. hugeParam (33) and
    # rangeValCopy would trade readable value receivers for pointers across the
    # tree; filepathJoin's 7 are all false, an absolute path handed to
    # filepath.Join as the root it is; unnamedResult, paramTypeCombine and
    # importShadow are taste. builtinShadow's two are `max`, an attempt limit
    # that predates the builtin and reads as what it is.
    - gocritic

    # The f at the end of a name is what says the first argument is a format
    # string and everything after it belongs to a verb. Without it the call
    # reads like one that prints what it was handed, and a string carrying a
    # percent sign — a path, a wallet's own error text, a passphrase prompt
    # somebody pasted — becomes a format directive nobody wrote.
    - goprintffuncname

    # A catalogue of ways a program can be unsafe: a subprocess built out of
    # something a caller controls, a file created where anyone may read it, a
    # weak digest, a host key check turned off, a random number that is not one.
    #
    # Its rules are being taken through this tree one at a time, and `includes`
    # below is how far that has got. A rule listed there has been read against
    # every place it fires and is either clean or answered at the line; a rule
    # not listed is not running, which is where one starts rather than where it
    # is left.
    - gosec

    # Already on through `default: standard`, and named here anyway: what is
    # configured below is the whole of govet rather than the subset the default
    # runs, and a line in this list is where a reader looks for the reason.
    - govet

    # A comment that stops without a full stop reads as a line that was cut off,
    # and leaves the reader deciding whether the rest of the thought is missing
    # or was never there. This tree explains itself in prose, and the full stop
    # is what says a thought has finished.
    - godot

    # Two interfaces declared in one package with the same method set are one
    # interface and a spare name for it: which of the two a signature means is
    # something the reader has to work out, and a method added to one leaves the
    # other behind still satisfying nothing.
    #
    # Only the default check, `identical`, is on. The other two were measured
    # and declined, because both report the way this tree is built rather than a
    # defect in it. `unused` wants an interface referred to inside the package
    # that declares it, and the interfaces here are declared where a thing is
    # implemented so that a package consuming it need not import a second one —
    # `hostcheck.Source`, `launcher.CgroupSource`, `prompt.TTY` — so what it
    # calls dead is the export itself. `opaque` wants a function that returns an
    # interface to return the concrete type instead, and the one it reports is
    # the seam that hands back this system's agent lifecycle, which is an
    # interface for the one reason it should be: each platform returns a
    # different concrete type through it.
    - iface

    # An import alias renames somebody else's package inside one file, so the
    # same package answers to a different name depending on which file is open.
    # No alias is allowed that is not listed below, and none is listed: a
    # package is called what it calls itself.
    - importas

    # `for i := 0; i < n; i++` states the bound three times and can be wrong in
    # three places; `for i := range n` states it once and cannot count wrong.
    - intrange

    # A const block that opens with iota numbers its members by where they sit
    # in it, so a plain declaration slipped in among them moves every member
    # below it — and the members written without a value stop following iota at
    # that point, repeating the expression above them instead. Either way the
    # block still compiles under the same names. The enums here are written that
    # way and are what the rest of the program switches on: what came of trying
    # to load a key, what state an agent is in, where a setting's value came
    # from.
    - iotamixing

    # A loop that searches a slice, copies one into another, or picks the
    # larger of two numbers is a loop whose edge cases have to be read to be
    # trusted; the standard function it replaces has a name that says what the
    # answer is.
    - modernize

    # An error seen and then not returned: the check runs, the branch is taken,
    # and the caller is still told the operation worked.
    - nilerr

    # The call that offers both shapes and gets the one without: exec.Command
    # where exec.CommandContext exists, net.Dial where a Dialer would take a
    # context. A timeout ends the wait; a context ends the work, and only one
    # of the two releases what the caller has given up on.
    - noctx

    # Every suppression must name the linter it silences and say why, so a
    # nolint stays an argument someone can disagree with rather than a way to
    # make a warning disappear.
    - nolintlint

    # A Sprintf whose format string is one verb is a conversion written the
    # long way round: strconv.Itoa says it returns a number's digits, and
    # `a + b` says it joins two strings, where `%d` and `%s` first say only
    # that something is being formatted.
    - perfsprint

    # Assertions are where a test says what it is for, and testify makes them
    # easy to write in a way that compiles, passes, and checks nothing: the
    # arguments the wrong way round, an error asserted present when absent was
    # meant, a require inside a goroutine — which calls FailNow off the test's
    # own goroutine and leaves the run hanging instead of failing.
    - testifylint

    # A helper that does not announce itself reports every failure at its own
    # line, so several tests that fail for different reasons all point at the
    # same place and none of them points at itself.
    - thelper

    # The testing package owns cleanup: t.TempDir and t.Setenv undo themselves
    # when the test ends, and their os equivalents leave the next test to find
    # what this one left behind.
    - usetesting

  settings:
    cyclop:
      # 96% of the functions here are at 7 or below, so this is not what keeps
      # them that way; what it catches is the handful doing several jobs at
      # once. The default of 10 would refuse the flat tables instead — the
      # command dispatcher alone scores 14 with no nesting at all.
      max-complexity: 20

    dupl:
      # A hundred tokens is about a dozen dense lines of Go, and the bar sits
      # there because of what lies on either side of it. Below are the few
      # repeated lines that are a case's own data — the fixture two neighbouring
      # tests set up the same way — where a name to resolve costs the reader
      # more than the repetition does. Above is a whole function written twice,
      # which is where the second copy starts drifting from the first.
      threshold: 100

    exhaustive:
      # A `default:` arm is an answer to every member the switch did not name,
      # so a switch that has one is exhaustive whatever the enum grows next —
      # and the `String()` methods here are written exactly that way, with the
      # zero value's text sitting in the default. Without this the linter would
      # report those and nothing else, and the one case worth reporting — a
      # switch with no default, where an unnamed member falls out of the bottom
      # and the code carries on — would be lost among them.
      default-signifies-exhaustive: true

    gocognit:
      # The same bar as cyclop, measured the other way round — see the note
      # beside the linter. The default of 30 is above everything in the tree
      # and would report nothing at all.
      min-complexity: 20

    goconst:
      # In a table-driven test the repeated literal is the case's own data —
      # the OS a fixture describes, the flag an argument list passes — and
      # lifting it into a constant hides what the case is about behind a name
      # the reader has to go and resolve.
      ignore-tests: true

    godot:
      # Declarations, the default, would leave most of the prose here
      # unchecked: as much of it is a note trailing a line of code as is a doc
      # comment standing above a function, and an unfinished thought reads the
      # same in either place.
      scope: all

    gosec:
      # `includes` names the rules that have been read against this tree and
      # kept; `excludes` names the ones that were read and declined, with the
      # reason each was. Between them they are how far the linter has been
      # taken — see the note beside it.
      includes:
        # A constant that looks like a credential — matched on its name. In a
        # program whose subject is passphrases, tokens and wallets, almost
        # everything it finds is the name of a place a secret travels rather
        # than a secret: an environment variable a passphrase is handed through,
        # a program called keepassxc-cli, a backend called credential-manager.
        # Each of those carries a suppression naming the word that matched. The
        # ones it is right about are a test's own invented passphrase for a key
        # the test invents, and those say so as well, because the rule is worth
        # keeping on for the day a real one is committed by mistake.
        - G101

        # A conversion that could lose what it is carrying. Nearly every one
        # here is a value crossing into an interface whose width is fixed by
        # somebody else — a kernel key serial, a uid, a window coordinate, the
        # length of a buffer this file declared — or a truncation that is the
        # algorithm itself, an increment carried through a nonce a byte at a
        # time. Each of those says so at the line. The rule stays on because it
        # paid for itself once already: a handoff token is text arriving from
        # the environment, and read into a 32-bit serial it kept its low half
        # and named a key of this user's that no stash had put there.
        - G115

        # A directory made where anyone may enter it. What this catches is
        # narrower than it looks: gosec reads the mode where it is written, so a
        # directory made with a named constant is invisible to it however open
        # that constant is, and the modes this program gives the directories it
        # installs are all named. What is left is a mode written out at the call
        # — which in this tree means a test laying out a scene — and those are
        # tight now, including the one directory a test deliberately closes: it
        # needs writing into to fail, and the owner alone being unable to write
        # is enough for that.
        - G301

        # A chmod to something more open than the owner's own read and write.
        # Read literally, which is what it does, that rules out every directory
        # there is: entering one is its execute bit, so 0o700 — the tightest a
        # directory can be and still be used by the account that owns it — is
        # already over the line. Those say so where they stand. The one file
        # among them is a test watching a startup file keep the mode it was
        # found with, where a mode the rule would accept would leave nothing to
        # watch.
        - G302

        # A file written where somebody other than its owner may read it. It
        # sees only what G301 sees — a mode written out at the call — so the
        # files this program installs, whose modes are named constants, are not
        # what it is watching; what it watches is a test laying out a scene, and
        # every one of those is a file nobody but the test has any business
        # reading. They are 0600 now, and the suite was run with every one of
        # them moved to be sure none had been relying on the access.
        #
        # What is left is the fifteen that are programs: a stand-in for zenity
        # or for a shell, an askpass helper, an editor. A program that cannot be
        # executed is not one, so those are over the line by necessity and say
        # so where they stand.
        - G306

        # An index that could be past the end of its slice. Both sites are
        # guarded and the guards are the ordinary ones: `len(args) == 1 &&
        # args[0] == …`, where Go evaluates the left operand first and the rule
        # does not read it as a condition; and an index stepped on inside a loop
        # with the new bound checked on the line above, which it does not follow
        # either, in that spelling or in the one that checks i+1 before using
        # it. Two suppressions, and the rule stays on for an index with nothing
        # in front of it at all.
        - G602

        # A path reaching a file operation from somewhere a caller controls,
        # found by following the path back rather than by noticing that it is a
        # variable. Where it arrives here is the environment, because that is
        # where this program's paths come from: the log file it appends a
        # session's lines to belongs to the account the process is running as,
        # named by that account's own XDG_STATE_HOME or home directory, and
        # doctor prints which file is in force.
        #
        # That is the rule's limit as much as its answer — it cannot tell an
        # account's own environment from a hostile source, so ten sites say
        # which one this is. It is on regardless, and the reason is arithmetic:
        # ten answered sites leave a new one visible, where the sixty-two of
        # G304 would bury it.
        - G703

      excludes:
        # A subprocess whose program is named by a variable. Every subprocess
        # this program starts is: ssh-agent and ssh-add, the wallet's own
        # command, pinentry, the shell a session is running, the editor a
        # setting names, and this program itself re-entered as another user.
        # None of them goes through a shell, so there is no command line for
        # anything to be smuggled into; what the rule sees is that the program's
        # name came from somewhere, and where it came from is the configuration
        # and the table that says which build of OpenSSH this system's agent can
        # be reached with. Unlike the rules above there is no future case here
        # worth catching — the next call will be a variable too, and a
        # suppression every one of them has to carry is one nobody reads.
        - G204

        # A file opened at a path held in a variable. Every file this program
        # reads is: the entries under /proc and /sys it reads a machine's state
        # out of, the lock it takes, the state it left itself last time, the
        # startup file of a shell somebody chose, the log. Sixty-two sites, and
        # what they have in common is only that a path was worked out before it
        # was opened.
        #
        # The question worth asking of a path — whether it came from somewhere a
        # caller controls — is G703's, which follows it there instead of noticing
        # the variable, and which is on. Turning both on would bury the eight
        # that know something under the sixty-two that do not.
        - G304

    govet:
      # Everything, so an analyser added to a future Go release arrives with it
      # rather than waiting to be noticed. What that turns on beyond the default
      # is `shadow`, and `shadow` is the reason: an inner `err` declared with :=
      # inside an `if` or a `for` leaves the outer one holding whatever it held
      # before, and the code below reads the wrong one while compiling and
      # passing. This program's error paths are what a login does when something
      # is wrong, and they are the least-exercised lines in it.
      enable-all: true
      disable:
        # fieldalignment orders a struct's fields by what packs tightest, and
        # the structs here are ordered for reading, each field documented where
        # it stands: a report's findings in the order the report prints them, a
        # config file's settings in the order the file lists them. It is 150-odd
        # rewrites that would each make a struct harder to read against a saving
        # nothing here is short of — this program runs once per login shell.
        - fieldalignment

    importas:
      # There is no `alias:` list here, and its absence is the rule: an alias
      # has to be argued for and written down before it may appear in a file.
      # Note that turning on no-unaliased as well makes this one report every
      # unaliased import in the tree, so it stands alone.
      no-extra-aliases: true

    nolintlint:
      require-explanation: true
      require-specific: true

    testifylint:
      disable:
        # require-error wants every error assertion to stop the test. Several
        # tests here check a handful of independent operations in a row — three
        # calls that must all be no-ops, say — and one report naming every one
        # that failed is worth more than a report naming the first. Which of the
        # two a given assertion wants is a judgement about that test, not
        # something a checker can read off the call.
        - require-error

    usetesting:
      # A test that roots its own context keeps it after the test that made it
      # has finished: t.Context() is cancelled when the test ends, so a call
      # left hanging fails the run instead of outliving it.
      context-background: true
      context-todo: true
      # Off by default, and both are worth having. os-setenv reports nothing
      # today, which is the state worth keeping: an os.Setenv survives the test
      # that made it. os-temp-dir costs two suppressions, at the one place
      # where a directory shared between test binaries is the whole point.
      os-setenv: true
      os-temp-dir: true

formatters:
  # gofumpt is gofmt plus the rules gofmt leaves to taste, so it subsumes a
  # plain gofmt sweep rather than competing with it. Formatting is also the one
  # check here that is not limited to a single build: `golangci-lint fmt` reads
  # files, while `run` compiles one GOOS with one set of build tags and cannot
  # see past it.
  enable:
    - gofumpt
