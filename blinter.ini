; Blinter's configuration, read by `make lint`'s lint-bat target.
;
; The rules below are turned off because they cannot apply to what this
; project's only batch file is: a stand-in editor the `sshakku config --edit`
; tests run, whose whole contract is to be told what to do by the environment
; and to report the arguments it was handed. Nothing else here is disabled —
; every other finding is fixed in the file rather than silenced here.

[rules]
; E006  — a variable is referenced without this script having set it. That is
;         the fixture's contract: the test sets SSHAKKU_TEST_EDITOR_RECORD and
;         SSHAKKU_TEST_EDITOR_BODY in the environment it runs the editor in,
;         and a stand-in that defined them itself would be answering its own
;         question.
; SEC013,
; SEC014 — %* used in a command without escaping. Recording the arguments
;         verbatim is the thing being verified: the test reads that record back
;         to check SSHakku passed on an $EDITOR's own arguments and opened the
;         right file. The "user input" is the test's own argv, in a fixture
;         that runs nowhere but the test suite.
disabled_rules = E006, SEC013, SEC014
